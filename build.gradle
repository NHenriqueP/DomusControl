plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['.']
            exclude 'testes/**'
            exclude 'build/**'
            exclude '.gradle/**'
            exclude '.vscode/**'
            exclude '.git/**'
            exclude 'lib/**'
        }
    }
    test {
        java {
            srcDirs = ['testes']
        }
    }
}

application {
    mainClass = 'UI.Main'
}

run {
    standardInput = System.in
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
